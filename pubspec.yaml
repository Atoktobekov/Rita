name: daily_todo
description: Daily planning, one small step at a time.
publish_to: none
version: 0.7.0+7

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  hive_ce: ^2.11.3
  hive_ce_flutter: '>=2.3.1 <2.4.0'
  intl: ^0.20.2
  flutter_local_notifications: ^19.5.0
  flutter_timezone: ^4.1.1
  timezone: ^0.10.1
  flutter_svg: ^2.0.17
  file_picker: ^10.3.10
  cross_file: ^0.3.4+2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/GolosText-OFL.txt
    - assets/fonts/Literata-OFL.txt
    - assets/fonts/DMSans-OFL.txt
  fonts:
    - family: Google Sans
      fonts:
        - asset: assets/fonts/GoogleSans.ttf
    - family: DM Sans
      fonts:
        - asset: assets/fonts/DMSans.ttf
    - family: Golos Text
      fonts:
        - asset: assets/fonts/GolosText.ttf
    - family: Literata
      fonts:
        - asset: assets/fonts/Literata.ttf
